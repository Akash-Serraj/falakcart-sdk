name: Release

# Push a tag such as v1.1.0-beta.1 (after `npm run version:bump`) to publish
# to the TEST org. Production (@falakcart) is published by hand with a 2FA
# code (README, "Releasing"), so a pushed tag can never reach live stores.
# Needs the NPM_TOKEN secret: a granular token for @test_falakcart only, with
# "bypass two-factor authentication" ticked.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test

      - name: Tag matches package version
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1
          fi

      - run: npm run release:publish -- --scope=test_falakcart
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
